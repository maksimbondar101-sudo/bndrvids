# Flat static site — nothing to build, so the repo root is the publish root.
#
# That means every file committed here is reachable at bndrvids.com/<name>,
# including the ones written for whoever maintains the site rather than for
# a customer. The redirects below 404 those explicitly instead of relying on
# nobody guessing the filename.
[build]
  publish = "."

# Internal files that live in the repo but have no business being served.
# force = true so these win over the static file that is actually sitting there.
[[redirects]]
  from = "/README.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/serve.ps1"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/assets/fonts/README.txt"
  to = "/404.html"
  status = 404
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=(), payment=()"
    # Both Google Fonts hosts are gone from this policy because both fonts are
    # now served from /assets/fonts. The policy is the check on that: if anyone
    # re-adds a fonts.googleapis.com <link>, the stylesheet is blocked outright
    # rather than quietly reintroducing a third-party request.
    # object-src 'none' is not covered by default-src on older engines, so it
    # is stated rather than inherited.
    #
    # cal.com is the ONE third party allowed to run here, and only because the
    # booking widget on /start is an iframe plus a script from app.cal.com. It
    # needs four grants and no more: script-src to load the embed, frame-src to
    # render the booker, connect-src for its availability lookups, and img-src
    # for avatars. Nothing else third-party belongs in this policy — if a fifth
    # host ever appears here, something has been added that should not have been.
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://app.cal.com; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: https://cal.com https://app.cal.com; media-src 'self'; object-src 'none'; connect-src 'self' https://formsubmit.co https://app.cal.com https://api.cal.com; frame-src https://cal.com https://app.cal.com; form-action 'self' https://formsubmit.co; frame-ancestors 'none'; base-uri 'self'"

# Fonts are content-addressed by filename: a different cut gets a different
# name, so a year of immutable caching can never strand anyone on a stale one.
# Nothing else here is versioned that way, so nothing else gets this treatment —
# Netlify's ETag revalidation is the right default for site.css and site.js.
[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
